[package]
name = "soma"
version = "0.3.0"
edition = "2021"
description = "Executable SOMA abstract-machine semantics and reference backends"
license = "MIT"

[features]
default = []
metal = ["dep:metal"]
native = [
    "dep:cranelift-codegen",
    "dep:cranelift-frontend",
    "dep:cranelift-jit",
    "dep:cranelift-module",
    "dep:cranelift-native",
]

[dependencies]
sha2 = "0.10"
cranelift-codegen = { version = "=0.131.0", optional = true }
cranelift-frontend = { version = "=0.131.0", optional = true }
cranelift-jit = { version = "=0.131.0", optional = true }
cranelift-module = { version = "=0.131.0", optional = true }
cranelift-native = { version = "=0.131.0", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
metal = { version = "0.33.0", optional = true }

[profile.release]
debug = true
